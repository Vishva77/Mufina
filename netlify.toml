[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["images/**", "server/**"]

# Redirect API requests to Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# SPA Fallback for HTML5 single page app navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
